<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1020" media="(prefers-color-scheme: dark)">
<!-- Gewähltes Design (hell oder dunkel) setzen, bevor die Seite gezeichnet wird -->
<script src="js/theme-init.js"></script>
<title>HEXA: Countdown</title>
<meta name="description" content="HEXA: Countdown – Würfel, Spielblock und Regeln für das Würfelspiel mit sechs Würfeln.">
<meta name="apple-mobile-web-app-title" content="HEXA">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<meta property="og:type" content="website">
<meta property="og:site_name" content="HEXA: Countdown">
<meta property="og:locale" content="de_DE">
<meta property="og:title" content="HEXA: Countdown – Das Würfelspiel">
<meta property="og:description" content="Sechs Würfel. Drei Würfe. Ein Countdown. Würfel, Spielblock und Regeln in einer App – direkt im Browser.">
<meta property="og:url" content="https://unpacked-dev.github.io/hexa/">
<meta property="og:image" content="https://unpacked-dev.github.io/hexa/docs/social-preview.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="css/hexa.css">

<script src="js/config.js" defer></script>
<script src="lang/de.js" defer></script>
<script src="lang/en.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/rules.js" defer></script>
<script src="js/bot.js" defer></script>
<script src="js/sound.js" defer></script>
<script src="js/online.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<!-- Einige Icons stammen aus Lucide (ISC-Lizenz, teils Feather/MIT), siehe THIRD-PARTY-NOTICES.md. -->
<section class="start" id="start" aria-labelledby="startName">
  <div class="sky sky-felt" id="startSky" aria-hidden="true"></div>
  <div class="start-top"><button type="button" class="start-gear" data-act="settings" data-i18n-label="start.settings" data-i18n-title="start.settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <div class="start-in">
    <header class="start-hero">
      <svg class="start-logo" viewBox="0 0 40 40" aria-hidden="true"><path class="hex" d="M20 3 34.7 11.5v17L20 37 5.3 28.5v-17z"/><g class="pip"><circle cx="15" cy="13.5" r="2.4"/><circle cx="15" cy="20" r="2.4"/><circle cx="15" cy="26.5" r="2.4"/><circle cx="25" cy="13.5" r="2.4"/><circle cx="25" cy="20" r="2.4"/><circle cx="25" cy="26.5" r="2.4"/></g></svg>
      <h1 class="start-name" id="startName">HEXA<span class="sr">: </span><span class="start-sub">Countdown</span></h1>
    </header>
    <div class="start-dice" id="startDice" aria-hidden="true"></div>
    <div class="start-modes">
      <button type="button" class="mode mode-play" data-act="play">
        <span class="mode-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" fill="currentColor"/></svg></span>
        <span class="mode-tx"><span class="mode-t" data-i18n="start.play"></span><span class="mode-s" id="playSub"></span></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mode-go" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
    <div class="start-links">
      <button type="button" class="start-set" data-act="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg><span data-i18n="start.learn"></span></button>
      <button type="button" class="start-set" data-act="scores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg><span data-i18n="start.scores"></span></button>
    </div>
    <noscript><p class="start-ns" lang="de">Bitte aktiviere JavaScript, um HEXA: Countdown zu spielen.</p><p class="start-ns" lang="en">Please enable JavaScript to play HEXA: Countdown.</p></noscript>
  </div>
</section>

<!-- Regeln als eigene Seite über dem Startbildschirm (aus „Spiel lernen“). Im Spiel stehen sie im Tab „Regeln“. -->
<section class="rules-page" id="rulesPage" data-i18n-label="views.rules" hidden>
  <div class="rp-in">
    <header class="rp-top">
      <button type="button" class="rp-back" data-act="rules-close" data-i18n-label="learn.backLabel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span data-i18n="learn.back"></span></button>
    </header>
    <div id="rulesBody"></div>
  </div>
</section>

<div class="sky sky-page" id="appSky" aria-hidden="true" hidden></div>
<div class="app" hidden>
  <header class="top">
    <button type="button" class="brand" data-act="menu" data-i18n-label="top.home" data-i18n-title="top.home">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path class="hex" d="M20 3 34.7 11.5v17L20 37 5.3 28.5v-17z"/><g class="pip"><circle cx="15" cy="13.5" r="2.4"/><circle cx="15" cy="20" r="2.4"/><circle cx="15" cy="26.5" r="2.4"/><circle cx="25" cy="13.5" r="2.4"/><circle cx="25" cy="20" r="2.4"/><circle cx="25" cy="26.5" r="2.4"/></g></svg>
      <span class="wordmark">HEXA</span>
    </button>
    <div class="top-r">
      <span class="top-status" id="topStatus"></span>
      <button type="button" class="icon-btn" data-act="settings" data-i18n-label="top.settings" data-i18n-title="top.settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </header>
  <div class="olbar" id="olBar" hidden></div>

  <main>
    <section class="view" id="view-players" data-view="players" data-i18n-label="views.players" hidden></section>
    <section class="view" id="view-online" data-view="online" data-i18n-label="views.online" hidden></section>
    <section class="view" id="view-dice" data-view="dice" data-i18n-label="views.dice" hidden></section>
    <section class="view" id="view-block" data-view="block" data-i18n-label="views.block" hidden></section>
    <section class="view" id="view-rules" data-view="rules" data-i18n-label="views.rules" hidden></section>
  </main>
</div>

<nav class="tabbar" data-i18n-label="tabs.label" hidden>
  <div class="tabbar-in">
    <button type="button" class="tab" data-act="menu" data-i18n-title="tabs.menuTitle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="tabs.menu"></span>
    </button>
    <div class="tab-cell">
      <button type="button" class="tab" data-act="tab" data-tab="dice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="tabs.dice"></span>
        <i class="badge" id="cdBadge" hidden></i>
      </button>
      <button type="button" class="tab-split" data-act="duo" data-for="dice" aria-pressed="false" data-i18n-label="tabs.openBlock" data-i18n-title="tabs.openBlock" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M10 4.5v15"/></svg></button>
    </div>
    <div class="tab-cell">
      <button type="button" class="tab" data-act="tab" data-tab="block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="3" width="15" height="18" rx="2.5"/><path d="M4.5 8.5h15"/><path d="M10 8.5V21"/><path d="M4.5 13h15"/><path d="M4.5 17h15"/></svg>
        <span data-i18n="tabs.block"></span>
      </button>
      <button type="button" class="tab-split" data-act="duo" data-for="block" aria-pressed="false" data-i18n-label="tabs.openDice" data-i18n-title="tabs.openDice" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M10 4.5v15"/></svg></button>
    </div>
    <button type="button" class="tab" data-act="tab" data-tab="rules">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M9 7.5h6"/><path d="M9 11h4"/></svg>
      <span data-i18n="tabs.rules"></span>
    </button>
  </div>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-bg" data-act="sheet-close"></div>
  <div class="sheet" role="dialog" aria-modal="true" data-i18n-label="common.dialog" tabindex="-1">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-body"></div>
  </div>
</div>

<div class="cd" id="cd" role="dialog" aria-modal="true" data-i18n-label="cd.title" tabindex="-1" hidden>
  <div class="cd-in"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="t-msg"></span>
  <button type="button" class="t-undo" data-act="undo" data-i18n="common.undo" hidden></button>
</div>
</body>
</html>
