name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wertung testen
        run: node --test

  server:
    name: Server-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Dieselbe Version wie im Dockerfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Server testen
        run: bun run test
      - name: Docker-Image bauen
        run: docker build -t hexa .
