name: Release

# Erstellt ein GitHub-Release mit den Notizen aus CHANGELOG.md und einer spielfertigen ZIP-Datei.
# So geht eine neue Version:
#   1. In CHANGELOG.md einen Abschnitt wie "## [1.2.0] – 2026-10-01" mit den Änderungen ergänzen und pushen.
#   2. Actions → Release → "Run workflow" → Version 1.2.0 eingeben (oder den Tag v1.2.0 pushen).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Neue Version, z. B. 1.2.0 (muss vorher in CHANGELOG.md stehen)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Version aus der Eingabe oder aus dem Tag; ein "v" davor ist egal.
          VERSION="$(printf '%s' "${INPUT_VERSION:-$GITHUB_REF_NAME}" | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Ungültige Version::Bitte eine Versionsnummer wie 1.2.0 eingeben."
            exit 1
          fi
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error title=Kein Eintrag in CHANGELOG.md::Für $VERSION fehlt der Abschnitt \"## [$VERSION]\" in CHANGELOG.md. Erst dort eintragen, was neu ist, pushen und dann den Workflow erneut starten."
            exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error title=Release gibt es schon::v$VERSION ist bereits veröffentlicht. Für neue Änderungen eine höhere Version wählen."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wertung testen
        run: node --test

      - name: Spielfertiges Paket bauen
        run: |
          mkdir -p dist/hexa
          cp -r index.html favicon.svg manifest.webmanifest css js lang fonts icons LICENSE THIRD-PARTY-NOTICES.md dist/hexa/
          (cd dist && zip -qr "../hexa-${TAG}.zip" hexa)

      - name: Notizen aus CHANGELOG.md holen
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { f = index($0, "[" v "]") > 0; next }
            /^\[[^]]+\]: / { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo
            echo "**▶ [Jetzt spielen](https://unpacked-dev.github.io/hexa/)** · Offline: \`hexa-${TAG}.zip\` herunterladen, entpacken und \`index.html\` öffnen."
          } >> notes.md

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gibt es den Tag noch nicht, legt gh ihn auf dem aktuellen Commit an.
          gh release create "$TAG" "hexa-${TAG}.zip" \
            --title "HEXA ${TAG}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
