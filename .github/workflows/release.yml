name: Release

# Erzeugt ein GitHub-Release mit den passenden Notizen aus CHANGELOG.md
# und einer spielfertigen ZIP-Datei. Zwei Wege:
#   - einen Tag wie v1.2.0 pushen, oder
#   - unter Actions → Release → "Run workflow" die Version eingeben (legt den Tag selbst an).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne "v", z. B. 1.2.0 (muss in CHANGELOG.md stehen)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wertung testen
        run: node --test

      - name: Spielfertiges Paket bauen
        run: |
          mkdir -p dist/hexa
          cp -r index.html favicon.svg manifest.webmanifest css js icons LICENSE dist/hexa/
          (cd dist && zip -qr "../hexa-${TAG}.zip" hexa)

      - name: Notizen aus CHANGELOG.md holen
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## \[/ { f = index($0, "[" v "]") > 0; next }
            /^\[[^]]+\]: / { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Kein Eintrag für $VERSION in CHANGELOG.md" >&2; exit 1; fi
          {
            echo
            echo "---"
            echo
            echo "**▶ [Jetzt spielen](https://unpacked-dev.github.io/hexa/)** · Offline: \`hexa-${TAG}.zip\` herunterladen, entpacken und \`index.html\` öffnen."
          } >> notes.md

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gibt es den Tag noch nicht, legt gh ihn auf dem aktuellen Commit an.
          gh release create "$TAG" "hexa-${TAG}.zip" \
            --title "HEXA ${TAG}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
